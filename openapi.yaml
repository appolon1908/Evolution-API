openapi: 3.1.0
info:
  title: Codestra Evolution Provider Adapter
  version: 0.1.0
  description: Internal provider adapter behind Middleware V3. Not a public command API.
paths:
  /healthz:
    get:
      responses:
        "200": { description: Healthy }
  /readyz:
    get:
      responses:
        "200": { description: "Ready in safe mode or configured provider mode. May carry warnings (meta_verify_token_missing) that do not block readiness." }
        "503": { description: "Not ready; reasons lists codes: <provider>_webhook_secret_missing, adapter_service_token_missing (empty or whitespace), middleware_event_url_missing (FORWARD_EVENTS_ENABLED=true without MIDDLEWARE_EVENT_URL). Booleans and codes only, never values." }
  /internal/v1/whatsapp/transport/health:
    get:
      responses:
        "200": { description: Provider configuration status }
  /internal/v1/whatsapp/transport/messages/{provider_message_id}:
    get:
      description: Internal provider message readback for Middleware V3.
      parameters:
        - in: path
          name: provider_message_id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Normalized provider state }
        "401": { description: Service authentication failed }
        "404": { description: Provider message not found }
  /internal/v1/whatsapp/transport/messages:
    post:
      description: Internal Middleware-to-provider translation. External send is disabled by default.
      responses:
        "202": { description: Provider accepted }
        "401": { description: Service authentication failed }
        "423": { description: Provider effects disabled }
  /internal/v1/whatsapp/webhooks/evolution:
    post:
      responses:
        "202": { description: Provider event normalized }
        "400": { description: Body is not JSON (malformed_payload) }
        "401": { description: Missing or wrong x-codestra-webhook-secret }
  /internal/v1/whatsapp/webhooks/meta:
    description: >-
      Known limitation: with FORWARD_EVENTS_ENABLED=true, batch items are
      forwarded to Middleware one at a time under one shared deadline
      (WEBHOOK_FORWARD_DEADLINE_MS). If a batch's total forward time exceeds
      the deadline, the adapter returns 503 and Meta redelivers the whole
      batch, which restarts at the first item. A batch that is always slower
      than the deadline never completes and its tail items are never
      forwarded before Meta stops retrying (7 days). Keep forwarding disabled
      at volume until the forwarding design (bounded parallel or a batched
      Middleware call) is decided.
    get:
      responses:
        "200": { description: Meta webhook verification challenge }
        "403": { description: Verification failed }
    post:
      responses:
        "200": { description: "Meta event(s) normalized; also returned (accepted false, malformed_payload) for a verified body that is not JSON, since Meta retries any non-200" }
        "401": { description: Invalid X-Hub-Signature-256 }
        "413": { description: "payload_too_large: body over 3 MiB (Meta documents payloads up to 3 MB); checked before signature verification" }
        "503": { description: "forward_deadline_exceeded: forwarding the batch to Middleware exceeded WEBHOOK_FORWARD_DEADLINE_MS (default 8000); Meta redelivers" }
